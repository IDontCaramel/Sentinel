name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: sentinel
          path: |
            build/libs/sentinel-*.jar
            !build/libs/*-slim.jar
          if-no-files-found: error
